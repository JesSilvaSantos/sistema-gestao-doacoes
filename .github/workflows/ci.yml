name: CI

on:
  push:
    branches:
      - main
      - revisao-codigo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install flask
          pip install pytest

      - name: Executar testes
        run: pytest